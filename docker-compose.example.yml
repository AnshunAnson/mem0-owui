name: mem0-owui

services:
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    restart: unless-stopped
    ports:
      - "9099:9099"
    environment:
      PIPELINES_API_KEY: change-me
    volumes:
      - ./pipelines:/app/pipelines
    extra_hosts:
      - "host.docker.internal:host-gateway"

  memory-control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8081
    env_file:
      - .env
    environment:
      OPENAI_BASE_URL: ${LLM_API_BASE}
      OPENAI_API_KEY: ${LLM_API_KEY}
    ports:
      - "8081:8081"
    depends_on:
      - redis
      - qdrant
      - neo4j
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  memory-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      OPENAI_BASE_URL: ${LLM_API_BASE}
      OPENAI_API_KEY: ${LLM_API_KEY}
    depends_on:
      - redis
      - qdrant
      - neo4j
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  memory-repair-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m app.worker.repair_main
    env_file:
      - .env
    depends_on:
      - redis
      - neo4j
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:latest
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
